# ============================================================
#  TRES GATOS · configuración del sitio
#  Después de cambiar este archivo, GitHub vuelve a publicar
#  el sitio solo (tarda 1–2 minutos).
# ============================================================

title: "Tres Gatos"
description: "Blog de divulgación académica."
lema: "No es mucho, pero es nuestro."
lang: es-CO
timezone: America/Bogota

# --- Dirección del sitio --------------------------------------
# El sitio usa el dominio propio (archivo CNAME), así que baseurl va vacío.
# No cambies estas dos líneas o el sitio se verá sin estilos ni imágenes.
url: "https://tres-gatos.com"
baseurl: ""

# --- Contacto y responsable (aparece en los textos legales) ---
correo: "contacto.tres.gatos@gmail.com"
responsable: "Deiby Rodríguez"
pais: "Colombia"
fecha_legal: "23 de octubre de 2026"   # última actualización de los textos legales

# --- Redes sociales -------------------------------------------
# Deja la url vacía ("") mientras la cuenta no exista:
# el icono se ve atenuado con el aviso "Próximamente".
redes:
  - nombre: Facebook
    icono: facebook
    url: "https://www.facebook.com/share/1GrE8Tq2NX/"
  - nombre: Instagram
    icono: instagram
    url: "https://www.instagram.com/blog.tresgatos/"
  - nombre: TikTok
    icono: tiktok
    url: "https://www.tiktok.com/@blog.tresgatos"
  - nombre: X
    icono: x
    url: "https://x.com/blogtresgatos"
  - nombre: Threads
    icono: threads
    url: "https://www.threads.com/@blog.tresgatos"
  - nombre: YouTube
    icono: youtube
    url: "https://www.youtube.com/channel/UCjwkeMWNzhZOFfcJbm_0PYw"

# --- Portada --------------------------------------------------
posts_por_carga: 6        # cuántas tarjetas aparecen cada vez que bajas en el scroll
segundos_carrusel: 5

# --- Lo técnico (normalmente no hace falta tocar) -------------
permalink: /posts/:title/
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
plugins:
  - jekyll-feed
  - jekyll-sitemap
feed:
  path: feed.xml
defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "paginas" }
    values: { layout: pagina }
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - _plantillas
  - vendor
  - node_modules
