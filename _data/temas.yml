# ============================================================
#  TEMAS (filtros de la portada)
#  - El orden de esta lista es el orden de los iconos en la barra.
#  - "slug": identificador sin tildes ni espacios. Es lo que pones
#    en los posts:  temas: [politica, economia]
#  - "icono": el nombre del dibujo en assets/img/iconos.svg
#    (id="t-NOMBRE"). Si creas un tema nuevo y aún no tiene
#    dibujo propio, usa  icono: generico  (estrella de alguacil).
#  "Recientes" no va aquí: es el filtro que muestra todo.
# ============================================================

